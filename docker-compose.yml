services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oursaas
      POSTGRES_USER: oursaas
      POSTGRES_PASSWORD: oursaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oursaas -d oursaas"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: .
      target: runtime
    image: oursaas:latest
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://oursaas:oursaas@db:5432/oursaas
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change-me-generated-secret
      FRONTEND_ORIGIN: http://localhost:5173
      CLIENT_ORIGIN: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
